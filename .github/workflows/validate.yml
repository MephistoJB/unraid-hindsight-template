name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate Unraid template
        run: ./scripts/validate-template.sh
      - name: Compile Hermes compatibility override
        run: python3 -m py_compile overrides/hermes/plugins/memory/hindsight/__init__.py
      - name: Test user-only Hindsight retention
        run: python3 scripts/test-hindsight-retention.py
      - name: Validate Compose
        env:
          HINDSIGHT_DB_NAME: hindsight
          HINDSIGHT_DB_USER: hindsight
          HINDSIGHT_DB_PASSWORD: validation-only
          HINDSIGHT_DATABASE_URL: postgresql://hindsight:validation-only@host.docker.internal:5432/hindsight
          HINDSIGHT_API_KEY: validation-only-api
          HINDSIGHT_CP_ACCESS_KEY: validation-only-ui
        run: |
          docker compose -f compose/compose.yaml config --quiet
          docker compose -f compose/external-postgres.yaml config --quiet
      - name: Verify pinned Hindsight architectures
        run: |
          docker buildx imagetools inspect \
            ghcr.io/vectorize-io/hindsight:0.8.5@sha256:0710076cd1539b4f89537d2e5b0ea1e4d179885bc12809a56cf748c538c8c4fb \
            | grep -q 'linux/amd64'
          docker buildx imagetools inspect \
            ghcr.io/vectorize-io/hindsight:0.8.5@sha256:0710076cd1539b4f89537d2e5b0ea1e4d179885bc12809a56cf748c538c8c4fb \
            | grep -q 'linux/arm64'
