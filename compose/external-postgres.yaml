name: hindsight

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.5@sha256:0710076cd1539b4f89537d2e5b0ea1e4d179885bc12809a56cf748c538c8c4fb
    container_name: hindsight
    restart: unless-stopped
    ports:
      - ${HINDSIGHT_API_PORT:-8888}:8888
      - ${HINDSIGHT_UI_PORT:-9999}:9999
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      HINDSIGHT_API_DATABASE_URL: ${HINDSIGHT_DATABASE_URL:?required}
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP: "true"
      HINDSIGHT_API_DB_POOL_MIN_SIZE: "2"
      HINDSIGHT_API_DB_POOL_MAX_SIZE: "10"
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:-http://macserver:11434/v1}
      HINDSIGHT_API_LLM_API_KEY: not-needed
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-qwen3-coder:30b}
      HINDSIGHT_API_LLM_MAX_CONCURRENT: ${HINDSIGHT_LLM_MAX_CONCURRENT:-1}
      HINDSIGHT_API_LLM_TIMEOUT: ${HINDSIGHT_LLM_TIMEOUT:-300}
      HINDSIGHT_API_LLM_MAX_RETRIES: ${HINDSIGHT_LLM_MAX_RETRIES:-2}
      HINDSIGHT_API_LLM_OLLAMA_NUM_CTX: ${HINDSIGHT_LLM_CONTEXT:-16384}
      HINDSIGHT_API_LLM_STRICT_SCHEMA_RETAIN: "true"
      HINDSIGHT_API_LLM_STRICT_SCHEMA_CONSOLIDATION: "true"
      HINDSIGHT_API_LLM_SEND_BANK_AS_USER: "false"
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: German
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      HINDSIGHT_API_EMBEDDINGS_LOCAL_TRUST_REMOTE_CODE: "false"
      HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU: "true"
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      HINDSIGHT_API_RERANKER_LOCAL_TRUST_REMOTE_CODE: "false"
      HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU: "true"
      HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT: "1"
      HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING: "true"
      HINDSIGHT_API_RERANKER_LOCAL_BATCH_SIZE: "16"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: "50"
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION_NATIVE_LANGUAGE: german
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?required}
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_API_KEY:?required}
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:?required}
      HINDSIGHT_API_MCP_ENABLED: "false"
      HINDSIGHT_API_ENABLE_OBSERVATIONS: ${HINDSIGHT_OBSERVATIONS_ENABLED:-false}
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: ${HINDSIGHT_AUTO_CONSOLIDATION_ENABLED:-false}
      HINDSIGHT_API_ENABLE_OBSERVATION_HISTORY: "false"
      HINDSIGHT_API_ACCESS_LOG: "false"
      HINDSIGHT_API_OTEL_TRACES_ENABLED: "false"
      HINDSIGHT_API_METRICS_INCLUDE_BANK_ID: "false"
      HINDSIGHT_API_LLM_DEBUG_DUMP_4XX: "false"
      HINDSIGHT_API_OPERATION_RETENTION_DAYS: ${HINDSIGHT_OPERATION_RETENTION_DAYS:-30}
      HINDSIGHT_API_WORKER_ID: hindsight-centralserver
      HINDSIGHT_API_WORKER_MAX_SLOTS: ${HINDSIGHT_WORKER_MAX_SLOTS:-2}
      HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS: ${HINDSIGHT_CONSOLIDATION_MAX_SLOTS:-1}
    volumes:
      - ${HINDSIGHT_APPDATA:-/mnt/user/appdata/hindsight}/cache:/home/hindsight/.cache
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8888/health
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 4
